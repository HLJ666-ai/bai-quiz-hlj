<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 新增手机移动端适配核心标签 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BAI营销认证刷题工具</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f5f6f7;
            padding:12px;
            max-width:1000px;
            margin:0 auto;
        }
        h1{
            font-size:1.25rem;
            margin-bottom:16px;
            color:#222;
        }
        .drop-area{
            border:2px dashed #b8c2cc;
            border-radius:10px;
            padding:24px 16px;
            text-align:center;
            background:#fff;
            margin-bottom:16px;
        }
        .drop-area.active{
            border-color:#2b7bdd;
            background:#edf4fc;
        }
        .btn-group{
            display:flex;
            gap:8px;
            flex-wrap:wrap;
            margin:10px 0;
        }
        button{
            padding:8px 14px;
            border:none;
            border-radius:6px;
            font-size:14px;
            cursor:pointer;
        }
        .btn-blue{
            background:#2b7bdd;
            color:white;
        }
        .btn-gray{
            background:#949ca6;
            color:white;
        }
        .tip-text{
            font-size:12px;
            color:#666;
            margin-top:6px;
        }
        .box-card{
            background:#fff;
            border-radius:10px;
            padding:14px;
            margin-bottom:12px;
        }
        .quiz-item{
            padding:12px;
            border:1px solid #e4e7ec;
            border-radius:8px;
            margin-bottom:10px;
            cursor:pointer;
        }
        .quiz-item:active{
            background:#f0f7ff;
        }
        /*刷题页面样式，手机适配*/
        .question-title{
            font-size:16px;
            font-weight:500;
            margin-bottom:14px;
            line-height:1.6;
        }
        .option-item{
            border:1px solid #dde1e7;
            border-radius:8px;
            padding:12px;
            margin:8px 0;
        }
        .option-item.selected{
            border-color:#2b7bdd;
            background:#edf4fc;
        }
        .control-bar{
            display:flex;
            justify-content:space-between;
            flex-wrap:wrap;
            gap:8px;
            margin:16px 0;
        }
        .analysis-block{
            background:#f7f8fa;
            padding:12px;
            border-radius:8px;
            margin-top:12px;
        }
        .hide{
            display:none !important;
        }
    </style>
</head>
<body>
<div id="page-home">
    <h1>BAI中级认证刷题工具（Excel拖拽导入）</h1>
    <div class="drop-area" id="dropZone">
        <p>📂 将Excel(.xlsx)拖拽到此区域</p>
        <p style="font-size:12px;color:#777;margin-top:4px">或者点击下方按钮选择文件</p>
    </div>
    <div class="btn-group">
        <button class="btn-blue" id="selectFileBtn">选择Excel文件</button>
        <button class="btn-gray" id="clearAllBtn">清空全部本地题库</button>
    </div>
    <div class="tip-text">Excel表头: 题库名称 | 题型 | 题干 | 选项A | 选项B | 选项C | 选项D | 正确答案 | 解析</div>

    <div class="box-card">
        <div><b>已导入题库列表（点击开始刷题）</b></div>
        <div style="font-size:12px;color:#777;margin-bottom:8px">暂无题库，请拖拽/选择Excel文件导入</div>
        <div id="libList"></div>
    </div>
</div>

<div id="page-quiz" class="hide">
    <div style="display:flex;justify-content:space-between;margin-bottom:10px">
        <span id="libNameShow"></span>
        <span id="countShow"></span>
    </div>
    <div id="questionBox">
        <div class="question-title" id="qTitle"></div>
        <div id="optionWrap"></div>
        <div class="control-bar">
            <button class="btn-gray" id="prevBtn">上一题</button>
            <button class="btn-blue" id="submitBtn">提交答案</button>
            <button class="btn-gray" id="nextBtn">下一题</button>
        </div>
        <div id="ansAnalysis" class="analysis-block hide"></div>
    </div>
    <div style="margin-top:20px">
        <button class="btn-gray" id="backHomeBtn">返回题库列表</button>
    </div>
</div>

<input type="file" id="fileInput" accept=".xlsx,.xls" hidden>

<script>
// 本地存储key
const STORAGE_KEY = "bai_quiz_libs";
let currentLib = null;
let currentIndex = 0;
let quizData = [];

// dom
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const selectFileBtn = document.getElementById('selectFileBtn');
const libListDom = document.getElementById('libList');
const clearAllBtn = document.getElementById('clearAllBtn');
const pageHome = document.getElementById("page-home");
const pageQuiz = document.getElementById("page-quiz");

// 初始化渲染题库列表
renderLibList();

//拖拽
dropZone.addEventListener('dragover',e=>{
    e.preventDefault();
    dropZone.classList.add('active');
})
dropZone.addEventListener('dragleave',()=>{
    dropZone.classList.remove('active');
})
dropZone.addEventListener('drop',e=>{
    e.preventDefault();
    dropZone.classList.remove('active');
    const f = e.dataTransfer.files[0];
    if(f) handleExcelFile(f);
})
selectFileBtn.onclick = ()=> fileInput.click();
fileInput.onchange = (e)=>{
    const f = e.target.files[0];
    if(f) handleExcelFile(f);
    fileInput.value = "";
}

//解析excel
function handleExcelFile(file){
    const reader = new FileReader();
    reader.onload = function(e){
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, {type:'array'});
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const jsonArr = XLSX.utils.sheet_to_json(sheet);
        if(!jsonArr || jsonArr.length ===0){
            alert("表格读取为空，请确认Excel内容");
            return;
        }
        //表头校验
        const first = jsonArr[0];
        const needKeys = ["题库名称","题型","题干","选项A","选项B","选项C","选项D","正确答案","解析"];
        const realKeys = Object.keys(first);
        let ok = true;
        for(let k of needKeys){
            if(!realKeys.includes(k)) ok=false;
        }
        if(!ok){
            alert("表头格式不对！必须严格：题库名称|题型|题干|选项A|选项B|选项C|选项D|正确答案|解析");
            return;
        }
        //分组
        const map = {};
        jsonArr.forEach(row=>{
            const name = row["题库名称"];
            if(!name) return;
            if(!map[name]) map[name]=[];
            map[name].push(row);
        })
        if(Object.keys(map).length===0){
            alert("没有读取到有效题库");
            return;
        }
        //存入localStorage
        let libs = JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');
        for(let libName in map){
            const idx = libs.findIndex(x=>x.name === libName);
            if(idx>=0){
                libs[idx].list = map[libName];
            }else{
                libs.push({name:libName, list:map[libName]})
            }
        }
        localStorage.setItem(STORAGE_KEY, JSON.stringify(libs));
        renderLibList();
        alert(`导入成功，共${Object.keys(map).length}个题库`);
    }
    reader.readAsArrayBuffer(file);
}

//渲染题库列表
function renderLibList(){
    const libs = JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');
    libListDom.innerHTML = '';
    if(libs.length===0){
        libListDom.innerHTML = `<div style="color:#777;font-size:12px">暂无题库，请拖拽/选择Excel文件导入</div>`;
        return;
    }
    libs.forEach(lib=>{
        const div = document.createElement('div');
        div.className = "quiz-item";
        div.innerHTML = `<div><b>${lib.name}</b> <span style="color:#666">共${lib.list.length}题</span></div>`;
        div.onclick = ()=> startQuiz(lib);
        libListDom.appendChild(div);
    })
}

clearAllBtn.onclick = ()=>{
    if(confirm("确认清空全部本地题库？")){
        localStorage.removeItem(STORAGE_KEY);
        renderLibList();
    }
}

//开始刷题
function startQuiz(libObj){
    currentLib = libObj;
    quizData = libObj.list;
    currentIndex = 0;
    pageHome.classList.add('hide');
    pageQuiz.classList.remove('hide');
    document.getElementById('libNameShow').innerText = libObj.name;
    renderQuestion();
}

function renderQuestion(){
    const item = quizData[currentIndex];
    document.getElementById('countShow').innerText = `${currentIndex+1}/${quizData.length}`;
    document.getElementById('qTitle').innerText = `【${item.题型}】${item.题干}`;
    const wrap = document.getElementById('optionWrap');
    wrap.innerHTML = '';
    ["A","B","C","D"].forEach(lab=>{
        const val = item[`选项${lab}`];
        if(!val) return;
        const div = document.createElement('div');
        div.className = "option-item";
        div.innerText = `${lab}. ${val}`;
        div.dataset.label = lab;
        div.onclick = ()=>{
            div.classList.toggle("selected");
        }
        wrap.appendChild(div);
    })
    document.getElementById("ansAnalysis").classList.add("hide");
}

document.getElementById("prevBtn").onclick = ()=>{
    if(currentIndex>0){
        currentIndex--;
        renderQuestion();
    }
}
document.getElementById("nextBtn").onclick = ()=>{
    if(currentIndex < quizData.length-1){
        currentIndex++;
        renderQuestion();
    }
}
document.getElementById("submitBtn").onclick = function(){
    const sel = Array.from(document.querySelectorAll(".option-item.selected")).map(d=>d.dataset.label).sort().join("");
    const realAns = quizData[currentIndex]["正确答案"].trim();
    const analysisDom = document.getElementById("ansAnalysis");
    analysisDom.classList.remove("hide");
    let resText = "";
    if(sel === realAns){
        resText = "✅回答正确";
    }else{
        resText = `❌回答错误，正确答案：${realAns}`;
    }
    const jx = quizData[currentIndex]["解析"] || "无解析";
    analysisDom.innerHTML = `<div>${resText}</div><div style="margin-top:8px">解析：${jx}</div>`;
}
document.getElementById("backHomeBtn").onclick = ()=>{
    pageQuiz.classList.add("hide");
    pageHome.classList.remove("hide");
}
</script>
</body>
</html>
